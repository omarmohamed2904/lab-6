<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mohamed - Cat Facts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #fdf6ec 0%, #f7e1c8 100%);
      min-height: 100vh;
      color: #3b2f2a;
    }
    .hero {
      text-align: center;
      padding: 48px 16px 24px;
    }
    .hero h1 {
      font-weight: 700;
      font-size: 2.6rem;
      margin-bottom: 4px;
    }
    .hero .subtitle {
      color: #8a6f5c;
      margin-bottom: 0;
    }
    .card-box {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(120, 80, 40, 0.15);
      padding: 28px;
      margin-bottom: 28px;
    }
    #loadBtn {
      background: #e07a2f;
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 12px 32px;
      border-radius: 999px;
      font-size: 1.05rem;
      transition: transform 0.15s, background 0.15s;
    }
    #loadBtn:hover { background: #c9661f; transform: translateY(-2px); }
    #loadBtn:disabled { background: #d9a77f; transform: none; }
    #catPhoto {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 14px;
      border: 4px solid #f7e1c8;
    }
    .photo-caption {
      color: #8a6f5c;
      font-size: 0.9rem;
      margin-top: 8px;
    }
    .facts-table {
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 0;
    }
    .facts-table thead th {
      background: #3b2f2a;
      color: #fff;
      border: none;
      padding: 14px;
    }
    .facts-table td {
      padding: 14px;
      vertical-align: middle;
    }
    .facts-table td:first-child {
      width: 90px;
      text-align: center;
      font-weight: 700;
      color: #e07a2f;
      font-size: 1.2rem;
    }
    .empty-row td { color: #a8907e !important; font-weight: 400 !important; font-size: 1rem !important; text-align: center; }
    main.container { margin: 0 auto; padding: 0 16px; }
    .text-center { text-align: center; }
    #status { color: #c0392b; margin-top: 16px; margin-bottom: 0; }
    #status:empty { display: none; }
    .facts-table { width: 100%; border-collapse: collapse; }
    .facts-table tbody tr:nth-child(odd) { background: #fbf4ec; }
    footer {
      text-align: center;
      color: #8a6f5c;
      font-size: 0.85rem;
      padding: 8px 0 32px;
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Cat Facts</h1>
    <p class="subtitle"><strong>Mohamed</strong></p>
  </header>

  <main class="container" style="max-width: 860px;">
    <div class="card-box text-center">
      <p class="mb-3">Click the button to load cat facts and a new photo.</p>
      <button id="loadBtn">Get Cat Facts</button>
      <p id="status" class="text-danger mt-3 mb-0"></p>
    </div>

    <!-- Picture already on the page; its src gets replaced by the API's catPhoto URL -->
    <div class="card-box text-center">
      <img id="catPhoto"
           src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20400%20300%22%3E%3Crect%20width%3D%22400%22%20height%3D%22300%22%20fill%3D%22%23f3e9dc%22/%3E%3Cpolygon%20points%3D%22140%2C95%20160%2C40%20195%2C85%22%20fill%3D%22%23e09f3e%22/%3E%3Cpolygon%20points%3D%22260%2C95%20240%2C40%20205%2C85%22%20fill%3D%22%23e09f3e%22/%3E%3Cellipse%20cx%3D%22200%22%20cy%3D%22140%22%20rx%3D%2275%22%20ry%3D%2265%22%20fill%3D%22%23e09f3e%22/%3E%3Cellipse%20cx%3D%22200%22%20cy%3D%22245%22%20rx%3D%2295%22%20ry%3D%2255%22%20fill%3D%22%23e09f3e%22/%3E%3Ccircle%20cx%3D%22175%22%20cy%3D%22130%22%20r%3D%229%22%20fill%3D%22%23333%22/%3E%3Ccircle%20cx%3D%22225%22%20cy%3D%22130%22%20r%3D%229%22%20fill%3D%22%23333%22/%3E%3Cpolygon%20points%3D%22193%2C155%20207%2C155%20200%2C163%22%20fill%3D%22%23c0505a%22/%3E%3Cpath%20d%3D%22M200%20163%20q-10%2012%20-20%204%20M200%20163%20q10%2012%2020%204%22%20stroke%3D%22%23333%22%20stroke-width%3D%223%22%20fill%3D%22none%22/%3E%3Cpath%20d%3D%22M150%20155%20h-45%20M150%20165%20l-42%2010%20M250%20155%20h45%20M250%20165%20l42%2010%22%20stroke%3D%22%23333%22%20stroke-width%3D%222%22/%3E%3Ctext%20x%3D%22200%22%20y%3D%22290%22%20font-family%3D%22Arial%22%20font-size%3D%2216%22%20text-anchor%3D%22middle%22%20fill%3D%22%23555%22%3EClick%20Get%20Cat%20Facts%20for%20a%20new%20photo%3C/text%3E%3C/svg%3E"
           alt="Cat photo" referrerpolicy="no-referrer">
          </div>

    <div class="card-box">
      <table class="table table-striped facts-table">
        <thead>
          <tr>
            <th scope="col" class="text-center">factId</th>
            <th scope="col">fact</th>
          </tr>
        </thead>
        <tbody id="factsBody">
          <tr class="empty-row"><td colspan="2">No facts loaded yet.</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>Data from brianobruno.github.io/cats.json</footer>

  <script>
    const API_URL = "https://brianobruno.github.io/cats.json";

    document.getElementById("loadBtn").addEventListener("click", loadCatFacts);

    async function loadCatFacts() {
      const status = document.getElementById("status");
      const button = document.getElementById("loadBtn");
      status.textContent = "";
      button.disabled = true;
      button.textContent = "Loading...";

      try {
        // Consume the REST API using GET
        const response = await fetch(API_URL, { method: "GET" });
        if (!response.ok) {
          throw new Error("Request failed with status " + response.status);
        }
        const data = await response.json();

        // Sort the facts array by factId (1 first, 5 last)
        const facts = data.facts.sort((a, b) => a.factId - b.factId);

        // Populate the table
        const tbody = document.getElementById("factsBody");
        tbody.innerHTML = "";
        facts.forEach(fact => {
          const row = document.createElement("tr");

          const idCell = document.createElement("td");
          idCell.textContent = fact.factId;

          const textCell = document.createElement("td");
          textCell.textContent = fact.text;

          row.appendChild(idCell);
          row.appendChild(textCell);
          tbody.appendChild(row);
        });

        // Update the existing picture with the URL returned by the API
        const img = document.getElementById("catPhoto");
        img.onerror = () => {
          status.textContent = "The facts loaded, but the cat photo could not be displayed.";
        };
        img.src = data.catPhoto;
      } catch (error) {
        status.textContent = "Error loading data: " + error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Get Cat Facts";
      }
    }
  </script>
</body>
</html>
